.badge{display:inline-block;margin-top:8px;color:var(--ac);font-weight:700;font-size:13px}

.det .row{display:flex;gap:8px}.det .row input{flex:1}
.foot{display:flex;gap:8px;padding:16px}.foot button{flex:1}

dialog{width:min(92vw,440px);border:1px solid #111;border-radius:0;background:#fff;color:var(--fg);padding:18px}

function openPop(i){if(!map)return;const m=M[i],el=document.createElement('div');el.className='kpop';el.innerHTML='<span class=x>✕</span>'+pop(m,i);

const pop=(m,i)=>{const p=done(m)&&lastPost(m);return `<div class=pop><b>${esc(m.n)}</b><small>정상 | ${m.h.toLocaleString()}m<br>인증지점: ${esc(m.p)}<br>${esc(m.l)}${done(m)?'<br><span style="color:'+AC+';font-weight:700">완등 '+fmt(S[m.n].date)+'</span>':''}</small>${p?`<img src="${p.img}">`:''}<button class="btn${done(m)?' line':''}">${done(m)?'완등 취소':'오늘 완등 체크'}</button></div>`};
const paintOne=i=>{const m=M[i],p=done(m)&&lastPost(m);if(p)thumbImg(p.th,img=>{if(done(M[i]))mk[i].setImage(img)});else mk[i].setImage(dot(done(m)))};

    const s=S[m.n]||{},p=done(m)&&lastPost(m);

    <div class=det><div class=loc>인증지점: ${esc(m.p)}</div><div class=row><input type=date value="${s.date||''}"><button class="btn${done(m)?' line':''}" data-chk=1>${done(m)?'완등 취소':'오늘 완등 체크'}</button></div><textarea rows=2 placeholder="메모">${esc(s.memo||'')}</textarea></div></div>`}).join('')||'<div class=empty>검색 결과가 없어요.</div>';
}
const mi=e=>M[+e.target.closest('.item').dataset.i];
$('#list').onclick=e=>{const el=e.target.closest('.item');if(!el)return;

function renderFeed(){

$('#feed').onclick=async e=>{if(!e.target.dataset.del||!confirm('이 게시물을 삭제할까요? (완등 기록은 그대로 남아요)'))return;

// 사진: 긴 변 1080px로 줄여 저장(용량 절약), 지도용 정사각 썸네일 96px 별도 생성
const prep=file=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>{
  const k=Math.min(1,1080/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);
  const t=document.createElement('canvas');t.width=t.height=96;const s=Math.min(i.width,i.height);t.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,96,96);
  let img;for(const q of [.82,.7,.55,.4]){img=c.toDataURL('image/jpeg',q);if(img.length<700000)break}
  res({img,th:t.toDataURL('image/jpeg',.8)});URL.revokeObjectURL(i.src)};i.onerror=rej;i.src=URL.createObjectURL(file)});
$('#newpost').onclick=()=>{$('#pm').innerHTML='<option value="">산을 선택하세요</option>'+M.map((m,i)=>[m,i]).sort((a,b)=>a[0].n.localeCompare(b[0].n,'ko')).map(([m,i])=>`<option value=${i}>${esc(m.n)}</option>`).join('');$('#pd').value=today();$('#pp').value='';$('#pc').value='';$('#prev').hidden=true;$('#dlg').showModal()};
$('#pp').onchange=()=>{const f=$('#pp').files[0];if(f){$('#prev').src=URL.createObjectURL(f);$('#prev').hidden=false}};
$('#pcancel').onclick=()=>$('#dlg').close();
$('#psave').onclick=async()=>{
  const f=$('#pp').files[0],mv=$('#pm').value;if(mv===''||!f){alert('산과 사진을 선택하세요');return}
  const m=M[+mv],date=$('#pd').value||today();$('#psave').disabled=true;
  try{const {img,th}=await prep(f);await putPost({id:Date.now(),mn:m.n,date,cap:$('#pc').value.trim(),img,th});
    if(!done(m))upd(m,{date});refresh();$('#dlg').close();tab('f')}
  catch{alert('저장에 실패했어요. 사진을 다시 선택하거나 저장 공간을 확인하세요.')}
  $('#psave').disabled=false};
// 탭. PC(넓은 화면)는 지도가 항상 오른쪽에 보이므로 '지도' 탭이 목록으로 대체됨
const views={m:'#vm',f:'#vf',l:'#vl'},btn={m:'#tm',f:'#tf',l:'#tl'},wide=matchMedia('(min-width:900px)');let cur='m';

wide.onchange=()=>tab(cur);

  if(cu){for(const n in d.S||{})await fb.fs.setDoc(fb.fs.doc(ucol('rec'),n),d.S[n]);for(const p of d.P||[])await putPost(p)}
  else{S=d.S||{};save();await tx('readwrite',s=>{s.clear();(d.P||[]).forEach(p=>s.put(p))});await loadP()}
  refresh()}catch{alert('올바른 백업 파일이 아니에요')}};i.click()};

ks.onload=()=>kakao.maps.load(()=>{if(!$('#vm').hidden||wide.matches)initMap()});ks.onerror=()=>{kfail=true;initMap()};document.head.appendChild(ks);
