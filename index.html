const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
function render(){
  const q=$('#q').value.trim(),f=$('#f').value,done=Object.values(S).filter(x=>x.date).length;
  $('#cnt').textContent=done+' / 100';$('#fill').style.width=done+'%';
  $('#list').innerHTML=M.filter(m=>(!q||(m.name+m.loc).includes(q))&&(f===''||!!(S[m.id]&&S[m.id].date)==(f==='1'))).map(m=>{
    const s=S[m.id]||{};
    return `<div class="m ${s.date?'done':''}" data-id=${m.id}><div class=top><input type=checkbox ${s.date?'checked':''}><b>${m.id}. ${m.name}</b><small>${m.h}m · ${esc(m.loc.split(',')[0])}</small></div>
    <div class=det><small>${esc(m.loc)}</small><input type=date value="${s.date||''}"><textarea rows=2 placeholder="메모">${esc(s.memo||'')}</textarea></div></div>`}).join('');
}
const upd=(id,p)=>{S[id]={...S[id],...p};save()};
$('#list').onclick=e=>{const el=e.target.closest('.m');if(!el)return;const id=el.dataset.id;
  if(e.target.type==='checkbox'){upd(id,{date:e.target.checked?new Date().toISOString().slice(0,10):''});render()}
  else if(e.target.closest('.top'))el.classList.toggle('open')};

$('#list').oninput=e=>{if(e.target.tagName==='TEXTAREA')upd(e.target.closest('.m').dataset.id,{memo:e.target.value})};

$('#imp').onclick=()=>{const i=document.createElement('input');i.type='file';i.onchange=async()=>{try{S=JSON.parse(await i.files[0].text());save();render()}catch{alert('올바른 백업 파일이 아니에요')}};i.click()};
